openapi: 3.0.3
info:
  title: 财务模块 - 发票管理API
  description: 发票管理接口
  version: 1.0.0

servers:
  - url: /api/v1/finance

tags:
  - name: Invoice
    description: 发票管理

paths:
  /invoices:
    get:
      tags:
        - Invoice
      summary: 查询发票列表
      operationId: listInvoices
      parameters:
        - name: invoiceType
          in: query
          description: 发票类型 (1=销售, 2=采购)
          schema:
            type: integer
            enum: [1, 2]
        - name: invoiceStatus
          in: query
          schema:
            type: integer
        - name: partnerId
          in: query
          schema:
            type: integer
            format: int64
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: keyword
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePageResponse'
      security:
        - bearerAuth: []

    post:
      tags:
        - Invoice
      summary: 创建发票
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
      security:
        - bearerAuth: []

  /invoices/{id}:
    get:
      tags:
        - Invoice
      summary: 获取发票详情
      operationId: getInvoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetailResponse'
      security:
        - bearerAuth: []

    put:
      tags:
        - Invoice
      summary: 更新发票
      operationId: updateInvoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceUpdateRequest'
      responses:
        '200':
          description: 更新成功
      security:
        - bearerAuth: []

  /invoices/{id}/void:
    post:
      tags:
        - Invoice
      summary: 作废发票
      operationId: voidInvoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  description: 作废原因
      responses:
        '200':
          description: 作废成功
      security:
        - bearerAuth: []

  /invoices/{id}/bills:
    get:
      tags:
        - Invoice
      summary: 获取发票关联的账单
      operationId: getInvoiceBills
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceBillRelation'
      security:
        - bearerAuth: []

  /invoices/{id}/bills/link:
    post:
      tags:
        - Invoice
      summary: 关联账单
      operationId: linkBills
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - billIds
              properties:
                billIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                amounts:
                  type: array
                  items:
                    type: number
                  description: 各账单关联金额(可选,默认全额)
      responses:
        '200':
          description: 关联成功
      security:
        - bearerAuth: []

  /invoices/{id}/bills/unlink:
    post:
      tags:
        - Invoice
      summary: 解除账单关联
      operationId: unlinkBill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - billId
              properties:
                billId:
                  type: integer
                  format: int64
      responses:
        '200':
          description: 解除成功
      security:
        - bearerAuth: []

  /invoices/statistics:
    get:
      tags:
        - Invoice
      summary: 发票统计
      operationId: getInvoiceStatistics
      parameters:
        - name: invoiceType
          in: query
          schema:
            type: integer
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceStatisticsResponse'
      security:
        - bearerAuth: []

components:
  schemas:
    InvoiceCreateRequest:
      type: object
      required:
        - invoiceType
        - invoiceNo
        - invoiceDate
        - partnerType
        - partnerId
        - amount
        - taxRate
      properties:
        invoiceType:
          type: integer
          enum: [1, 2]
          description: 1=销售发票, 2=采购发票
        invoiceNo:
          type: string
          maxLength: 50
          description: 发票号码
        invoiceCode:
          type: string
          maxLength: 20
          description: 发票代码
        invoiceDate:
          type: string
          format: date
        partnerType:
          type: integer
          enum: [1, 2]
          description: 1=客户, 2=供应商
        partnerId:
          type: integer
          format: int64
        amount:
          type: number
          description: 金额(不含税)
          minimum: 0
        taxRate:
          type: number
          description: 税率(%)
          minimum: 0
          maximum: 100
        currency:
          type: string
          default: CNY
        remark:
          type: string
          maxLength: 500

    InvoiceUpdateRequest:
      type: object
      properties:
        invoiceDate:
          type: string
          format: date
        amount:
          type: number
        taxRate:
          type: number
        remark:
          type: string

    InvoiceResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        invoiceNo:
          type: string
        invoiceType:
          type: integer
        invoiceStatus:
          type: integer
        totalAmount:
          type: number

    InvoiceDetailResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        invoiceNo:
          type: string
        invoiceCode:
          type: string
        invoiceType:
          type: integer
        invoiceTypeName:
          type: string
        invoiceStatus:
          type: integer
        invoiceStatusName:
          type: string
        invoiceDate:
          type: string
          format: date
        partnerType:
          type: integer
        partnerId:
          type: integer
          format: int64
        partnerName:
          type: string
        amount:
          type: number
          description: 不含税金额
        taxRate:
          type: number
        taxAmount:
          type: number
        totalAmount:
          type: number
          description: 价税合计
        currency:
          type: string
        linkedAmount:
          type: number
          description: 已关联账单金额
        unlinkedAmount:
          type: number
          description: 未关联金额
        remark:
          type: string
        voidReason:
          type: string
        voidByName:
          type: string
        voidAt:
          type: string
          format: date-time
        createdByName:
          type: string
        createdAt:
          type: string
          format: date-time

    InvoicePageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceDetailResponse'
        totalElements:
          type: integer
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    InvoiceBillRelation:
      type: object
      properties:
        billId:
          type: integer
          format: int64
        billNo:
          type: string
        billType:
          type: integer
        billAmount:
          type: number
        linkedAmount:
          type: number
        linkedAt:
          type: string
          format: date-time

    InvoiceStatisticsResponse:
      type: object
      properties:
        totalInvoiceCount:
          type: integer
          description: 发票总数
        totalAmount:
          type: number
          description: 总金额(不含税)
        totalTaxAmount:
          type: number
          description: 总税额
        totalWithTax:
          type: number
          description: 价税合计
        voidedCount:
          type: integer
          description: 作废数量
        voidedAmount:
          type: number
          description: 作废金额
        byTaxRate:
          type: array
          description: 按税率分布
          items:
            type: object
            properties:
              taxRate:
                type: number
              count:
                type: integer
              amount:
                type: number
              taxAmount:
                type: number

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
