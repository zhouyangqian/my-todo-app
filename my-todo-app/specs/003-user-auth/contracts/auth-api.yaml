openapi: 3.0.3
info:
  title: 认证 API
  description: 登录、登出、Token刷新、密码修改接口
  version: 1.0.0

servers:
  - url: /api/v1
    description: 网关路由

tags:
  - name: auth
    description: 用户认证
  - name: profile
    description: 个人资料管理

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: 用户登录
      description: 用户通过用户名和密码登录，返回访问令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: "admin"
                  description: 用户名
                password:
                  type: string
                  format: password
                  example: "Password123"
                  description: 密码
                captchaId:
                  type: string
                  example: "uuid"
                  description: 验证码 ID (连续失败3次后必填)
                captchaCode:
                  type: string
                  example: "a1b2"
                  description: 验证码 (连续失败3次后必填)
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 登录失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: "用户名或密码错误"
                  data:
                    type: object
                    properties:
                      remainingAttempts:
                        type: integer
                        description: 剩余尝试次数
                      requireCaptcha:
                        type: boolean
                        description: 是否需要验证码
        '403':
          description: 账号被禁用或锁定
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 403
                  message:
                    type: string
                    example: "账号已被锁定，请30分钟后再试"

  /auth/logout:
    post:
      tags: [auth]
      summary: 用户登出
      description: 用户主动登出，Token 立即失效 (支持全端登出)
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                logoutAll:
                  type: boolean
                  default: false
                  description: 是否全端登出 (所有设备)
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "登出成功"

  /auth/refresh:
    post:
      tags: [auth]
      summary: 刷新Token
      description: 使用 Refresh Token 获取新的访问令牌
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  description: Refresh Token
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 刷新失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: "Token已过期，请重新登录"

  /auth/profile:
    get:
      tags: [profile]
      summary: 查看个人资料
      description: 查看当前用户的账户信息
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/UserProfile'

  /auth/profile/password:
    put:
      tags: [profile]
      summary: 修改密码
      description: 用户自助修改密码 (需要验证旧密码)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword:
                  type: string
                  format: password
                  description: 旧密码
                newPassword:
                  type: string
                  format: password
                  description: 新密码 (最少8位，包含字母和数字)
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "密码修改成功，请重新登录"
        '400':
          description: 修改失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: "旧密码错误"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Access Token (有效期2小时)
        refreshToken:
          type: string
          description: Refresh Token (有效期7天)
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: integer
          description: Access Token 过期时间 (秒)
          example: 7200
        user:
          type: object
          properties:
            userId:
              type: integer
            username:
              type: string
            email:
              type: string
            tenantId:
              type: integer
            roles:
              type: array
              items:
                type: object
                properties:
                  roleId:
                    type: integer
                  roleName:
                    type: string
                  roleCode:
                    type: string
            permissions:
              type: array
              items:
                type: string
              description: 权限代码列表

    UserProfile:
      type: object
      properties:
        userId:
          type: integer
        username:
          type: string
        email:
          type: string
        phone:
          type: string
        tenantId:
          type: integer
        tenantName:
          type: string
        status:
          type: integer
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
