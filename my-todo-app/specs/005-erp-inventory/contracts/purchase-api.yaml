openapi: 3.0.3
info:
  title: 采购管理 API
  description: 采购订单、入库、退货管理接口
  version: 1.0.0

servers:
  - url: /api/v1
    description: ERP 服务

tags:
  - name: supplier
    description: 供应商管理
  - name: purchase-order
    description: 采购订单
  - name: purchase-receipt
    description: 采购入库
  - name: purchase-return
    description: 采购退货

paths:
  /suppliers:
    get:
      tags: [supplier]
      summary: 查询供应商列表
      security:
        - BearerAuth: []
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      records:
                        type: array
                        items:
                          $ref: '#/components/schemas/Supplier'
                      total:
                        type: integer

    post:
      tags: [supplier]
      summary: 创建供应商
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code:
                  type: string
                  example: "SUP001"
                name:
                  type: string
                  example: "供应商A"
                contact:
                  type: string
                  example: "张三"
                phone:
                  type: string
                  example: "13800138000"
                email:
                  type: string
                  example: "contact@example.com"
                address:
                  type: string
                  example: "北京市朝阳区"
                creditLimit:
                  type: number
                  format: decimal
                  example: 100000.00
      responses:
        '200':
          description: 创建成功

  /suppliers/{id}:
    get:
      tags: [supplier]
      summary: 查询供应商详情
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    $ref: '#/components/schemas/Supplier'

    put:
      tags: [supplier]
      summary: 更新供应商
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                contact:
                  type: string
                phone:
                  type: string
                creditLimit:
                  type: number
      responses:
        '200':
          description: 更新成功

    delete:
      tags: [supplier]
      summary: 删除供应商
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  /purchase-orders:
    get:
      tags: [purchase-order]
      summary: 查询采购订单列表
      security:
        - BearerAuth: []
      parameters:
        - name: supplierId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, CONFIRMED, PARTIAL_RECEIVED, COMPLETED, CANCELLED]
        - name: orderDateStart
          in: query
          schema:
            type: string
            format: date
        - name: orderDateEnd
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
        - name: size
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      records:
                        type: array
                        items:
                          $ref: '#/components/schemas/PurchaseOrder'
                      total:
                        type: integer

    post:
      tags: [purchase-order]
      summary: 创建采购订单
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderCreateRequest'
      responses:
        '200':
          description: 创建成功

  /purchase-orders/{id}:
    get:
      tags: [purchase-order]
      summary: 查询采购订单详情
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 查询成功

    put:
      tags: [purchase-order]
      summary: 更新采购订单
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deliveryDate:
                  type: string
                  format: date
                remark:
                  type: string
      responses:
        '200':
          description: 更新成功

  /purchase-orders/{id}/approve:
    post:
      tags: [purchase-order]
      summary: 审批采购订单
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [APPROVE, REJECT]
                comment:
                  type: string
      responses:
        '200':
          description: 审批成功

  /purchase-orders/{id}/cancel:
    post:
      tags: [purchase-order]
      summary: 取消采购订单
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 取消成功

  /purchase-receipts:
    get:
      tags: [purchase-receipt]
      summary: 查询采购入库单列表
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: query
          schema:
            type: integer
        - name: receiptNo
          in: query
          schema:
            type: string
        - name: receiptDateStart
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 查询成功

    post:
      tags: [purchase-receipt]
      summary: 创建采购入库单
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseReceiptCreateRequest'
      responses:
        '200':
          description: 创建成功

  /purchase-receipts/{id}:
    get:
      tags: [purchase-receipt]
      summary: 查询入库单详情
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 查询成功

  /purchase-returns:
    get:
      tags: [purchase-return]
      summary: 查询采购退货单列表
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 查询成功

    post:
      tags: [purchase-return]
      summary: 创建采购退货单
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplierId, returnDate, items]
              properties:
                orderId:
                  type: integer
                receiptId:
                  type: integer
                supplierId:
                  type: integer
                returnDate:
                  type: string
                  format: date
                items:
                  type: array
                  items:
                    type: object
                    required: [productId, returnQuantity]
                    properties:
                      productId:
                        type: integer
                      returnQuantity:
                        type: integer
                      returnReason:
                        type: string
                returnReason:
                  type: string
      responses:
        '200':
          description: 创建成功

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Supplier:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        contact:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        creditLimit:
          type: number
          format: decimal
        currentDebt:
          type: number
          format: decimal
        status:
          type: integer
          enum: [0, 1]
        createdAt:
          type: string
          format: date-time

    PurchaseOrder:
      type: object
      properties:
        id:
          type: integer
        orderNo:
          type: string
        supplierId:
          type: integer
        supplierName:
          type: string
        orderDate:
          type: string
          format: date
        deliveryDate:
          type: string
          format: date
        totalAmount:
          type: number
          format: decimal
        status:
          type: string
          enum: [PENDING, CONFIRMED, PARTIAL_RECEIVED, COMPLETED, CANCELLED]
        remark:
          type: string
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderItem'

    PurchaseOrderItem:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          format: decimal
        amount:
          type: number
          format: decimal
        receivedQuantity:
          type: integer

    PurchaseOrderCreateRequest:
      type: object
      required: [supplierId, orderDate, items]
      properties:
        supplierId:
          type: integer
        orderDate:
          type: string
          format: date
        deliveryDate:
          type: string
          format: date
        items:
          type: array
          items:
            type: object
            required: [productId, quantity, unitPrice]
            properties:
              productId:
                type: integer
              quantity:
                type: integer
              unitPrice:
                type: number
                format: decimal
        remark:
          type: string

    PurchaseReceiptCreateRequest:
      type: object
      required: [orderId, receiptDate, warehouseId, items]
      properties:
        orderId:
          type: integer
        receiptDate:
          type: string
          format: date
        warehouseId:
          type: integer
        items:
          type: array
          items:
            type: object
            required: [orderItemId, receivedQuantity]
            properties:
              orderItemId:
                type: integer
              receivedQuantity:
                type: integer
              batchNo:
                type: string
              productionDate:
                type: string
                format: date
              expiryDate:
                type: string
                format: date
        remark:
          type: string
