openapi: 3.0.3
info:
  title: 报表与统计分析 API
  description: 进销存报表生成与数据统计接口
  version: 1.0.0

servers:
  - url: /api/v1
    description: ERP 服务

tags:
  - name: purchase-report
    description: 采购报表
  - name: sales-report
    description: 销售报表
  - name: inventory-report
    description: 库存报表
  - name: profit-report
    description: 利润分析报表

paths:
  /reports/purchase:
    get:
      tags: [purchase-report]
      summary: 采购报表
      description: 按时间段、供应商、商品统计采购数据
      security:
        - BearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: supplierId
          in: query
          schema:
            type: integer
        - name: productId
          in: query
          schema:
            type: integer
        - name: groupBy
          in: query
          description: 分组维度
          schema:
            type: string
            enum: [SUPPLIER, PRODUCT, DATE, CATEGORY]
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      summary:
                        $ref: '#/components/schemas/PurchaseSummary'
                      details:
                        type: array
                        items:
                          type: object
                          properties:
                            dimension:
                              type: string
                              description: 分组维度值（供应商名/商品名/日期）
                            dimensionId:
                              type: integer
                            orderCount:
                              type: integer
                            totalQuantity:
                              type: integer
                            totalAmount:
                              type: number
                              format: decimal
                            avgPrice:
                              type: number
                              format: decimal

  /reports/sales:
    get:
      tags: [sales-report]
      summary: 销售报表
      description: 按时间段、客户、商品统计销售数据
      security:
        - BearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: customerId
          in: query
          schema:
            type: integer
        - name: productId
          in: query
          schema:
            type: integer
        - name: groupBy
          in: query
          description: 分组维度
          schema:
            type: string
            enum: [CUSTOMER, PRODUCT, DATE, CATEGORY, SALESPERSON]
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      summary:
                        $ref: '#/components/schemas/SalesSummary'
                      details:
                        type: array
                        items:
                          type: object
                          properties:
                            dimension:
                              type: string
                            dimensionId:
                              type: integer
                            orderCount:
                              type: integer
                            totalQuantity:
                              type: integer
                            totalAmount:
                              type: number
                              format: decimal
                            costAmount:
                              type: number
                              format: decimal
                            profitAmount:
                              type: number
                              format: decimal
                            profitRate:
                              type: number
                              format: decimal
                            receivedAmount:
                              type: number
                              format: decimal
                            receivedRate:
                              type: number
                              format: decimal

  /reports/inventory:
    get:
      tags: [inventory-report]
      summary: 库存报表
      description: 按仓库、商品类别统计库存数据
      security:
        - BearerAuth: []
      parameters:
        - name: asOfDate
          in: query
          description: 统计截止日期
          schema:
            type: string
            format: date
        - name: warehouseId
          in: query
          schema:
            type: integer
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: groupBy
          in: query
          description: 分组维度
          schema:
            type: string
            enum: [WAREHOUSE, PRODUCT, CATEGORY]
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      summary:
                        $ref: '#/components/schemas/InventorySummary'
                      details:
                        type: array
                        items:
                          type: object
                          properties:
                            dimension:
                              type: string
                            dimensionId:
                              type: integer
                            totalQuantity:
                              type: integer
                            totalAmount:
                              type: number
                              format: decimal
                            turnoverDays:
                              type: number
                              description: 库存周转天数
                            turnoverRate:
                              type: number
                              description: 库存周转率
                            avgCost:
                              type: number
                              format: decimal

  /reports/profit:
    get:
      tags: [profit-report]
      summary: 利润分析报表
      description: 统计销售收入、成本、毛利、毛利率
      security:
        - BearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: groupBy
          in: query
          description: 分组维度
          schema:
            type: string
            enum: [TOTAL, DAILY, PRODUCT, CATEGORY, CUSTOMER]
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      summary:
                        $ref: '#/components/schemas/ProfitSummary'
                      details:
                        type: array
                        items:
                          type: object
                          properties:
                            dimension:
                              type: string
                            salesRevenue:
                              type: number
                              format: decimal
                            purchaseCost:
                              type: number
                              format: decimal
                            grossProfit:
                              type: number
                              format: decimal
                            grossProfitRate:
                              type: number
                              format: decimal
                              description: 毛利率 %

  /reports/dashboard:
    get:
      tags: [sales-report]
      summary: 经营看板数据
      description: 获取关键经营指标汇总，用于仪表盘展示
      security:
        - BearerAuth: []
      parameters:
        - name: date
          in: query
          description: 统计日期，默认为当天
          schema:
            type: string
            format: date
        - name: period
          in: query
          description: 统计周期
          schema:
            type: string
            enum: [TODAY, WEEK, MONTH, QUARTER, YEAR]
            default: MONTH
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    $ref: '#/components/schemas/DashboardData'

  /reports/top-products:
    get:
      tags: [sales-report]
      summary: 商品销售排行
      description: 查询指定时间段内销售量/销售额最高的商品
      security:
        - BearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: orderBy
          in: query
          description: 排序依据
          schema:
            type: string
            enum: [QUANTITY, AMOUNT, PROFIT]
            default: AMOUNT
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        rank:
                          type: integer
                        productId:
                          type: integer
                        productName:
                          type: string
                        totalQuantity:
                          type: integer
                        totalAmount:
                          type: number
                          format: decimal
                        profitAmount:
                          type: number
                          format: decimal
                        profitRate:
                          type: number
                          format: decimal

  /reports/export:
    post:
      tags: [sales-report]
      summary: 导出报表
      description: 将报表数据导出为 Excel 文件
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportType, params]
              properties:
                reportType:
                  type: string
                  enum: [PURCHASE, SALES, INVENTORY, PROFIT]
                params:
                  type: object
                  description: 报表查询参数，与对应报表查询接口参数一致
                fileName:
                  type: string
                  description: 导出文件名，不包含扩展名
      responses:
        '200':
          description: 导出成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      downloadUrl:
                        type: string
                        description: 下载链接
                      fileName:
                        type: string
                        description: 文件名
                      fileSize:
                        type: integer
                        description: 文件大小（字节）

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PurchaseSummary:
      type: object
      properties:
        orderCount:
          type: integer
          description: 采购订单数
        totalQuantity:
          type: integer
          description: 采购总数量
        totalAmount:
          type: number
          format: decimal
          description: 采购总金额
        paidAmount:
          type: number
          format: decimal
          description: 已付金额
        unpaidAmount:
          type: number
          format: decimal
          description: 未付金额
        supplierCount:
          type: integer
          description: 供应商数量

    SalesSummary:
      type: object
      properties:
        orderCount:
          type: integer
          description: 销售订单数
        totalQuantity:
          type: integer
          description: 销售总数量
        totalAmount:
          type: number
          format: decimal
          description: 销售总额
        costAmount:
          type: number
          format: decimal
          description: 销售成本
        profitAmount:
          type: number
          format: decimal
          description: 毛利
        profitRate:
          type: number
          format: decimal
          description: 毛利率 %
        receivedAmount:
          type: number
          format: decimal
          description: 已收金额
        receivableAmount:
          type: number
          format: decimal
          description: 应收金额
        customerCount:
          type: integer
          description: 客户数量

    InventorySummary:
      type: object
      properties:
        totalQuantity:
          type: integer
          description: 库存总数量
        totalAmount:
          type: number
          format: decimal
          description: 库存总金额
        avgCost:
          type: number
          format: decimal
          description: 平均成本
        warehouseCount:
          type: integer
          description: 仓库数量
        productCount:
          type: integer
          description: 商品数量
        lowStockCount:
          type: integer
          description: 低库存商品数
        overStockCount:
          type: integer
          description: 积压商品数
        expiringCount:
          type: integer
          description: 即将过期商品数
        turnoverDays:
          type: number
          description: 整体库存周转天数
        turnoverRate:
          type: number
          description: 整体库存周转率

    ProfitSummary:
      type: object
      properties:
        salesRevenue:
          type: number
          format: decimal
          description: 销售收入
        purchaseCost:
          type: number
          format: decimal
          description: 采购成本
        grossProfit:
          type: number
          format: decimal
          description: 毛利
        grossProfitRate:
          type: number
          format: decimal
          description: 毛利率 %
        operatingCost:
          type: number
          format: decimal
          description: 运营成本
        netProfit:
          type: number
          format: decimal
          description: 净利润
        netProfitRate:
          type: number
          format: decimal
          description: 净利率 %

    DashboardData:
      type: object
      properties:
        period:
          type: string
          description: 统计周期
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        sales:
          type: object
          properties:
            orderCount:
              type: integer
            totalAmount:
              type: number
              format: decimal
            vsLastPeriod:
              type: number
              format: decimal
              description: 较上期增长率 %
        profit:
          type: object
          properties:
            grossProfit:
              type: number
              format: decimal
            profitRate:
              type: number
              format: decimal
            vsLastPeriod:
              type: number
              format: decimal
        inventory:
          type: object
          properties:
            totalAmount:
              type: number
              format: decimal
            turnoverDays:
              type: number
            lowStockCount:
              type: integer
        topProducts:
          type: array
          description: 热销商品 TOP5
          items:
            type: object
            properties:
              productName:
                type: string
              quantity:
                type: integer
              amount:
                type: number
                format: decimal
        topCustomers:
          type: array
          description: 客户排行 TOP5
          items:
            type: object
            properties:
              customerName:
                type: string
              amount:
                type: number
                format: decimal
        pendingTasks:
          type: object
          properties:
            pendingApprovalCount:
              type: integer
              description: 待审批订单数
            lowStockCount:
              type: integer
              description: 低库存商品数
            expiringCount:
              type: integer
              description: 即将过期批次数
            overduePaymentCount:
              type: integer
              description: 逾期应收数
