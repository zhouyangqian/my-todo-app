# Docker/K8s profile overrides
spring:
  datasource:
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 30
  data:
    redis:
      lettuce:
        pool:
          max-active: 16

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.example.user: INFO
