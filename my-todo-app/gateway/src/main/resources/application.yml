server:
  port: 8088

spring:
  application:
    name: gateway
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Auth Service
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        # User Service
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        # Permission Service
        - id: permission-service
          uri: lb://permission-service
          predicates:
            - Path=/api/permissions/**,/api/roles/**,/api/system/**

        # Inventory Service (must be before erp-service to match /api/erp/inventory/**)
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/erp/inventory/**
          filters:
            - RewritePath=/api/erp/inventory(?<segment>/?.*), /api/inventory${segment}

        - id: inventory-check-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/erp/inventory-checks/**
          filters:
            - RewritePath=/api/erp/inventory-checks(?<segment>/?.*), /api/inventory/checks${segment}

        # ERP Service
        - id: erp-service
          uri: lb://erp-service
          predicates:
            - Path=/api/erp/**

        # Finance Service
        - id: finance-service
          uri: lb://finance-service
          predicates:
            - Path=/api/finance/**

        # Dict Service
        - id: dict-service
          uri: lb://dict-service
          predicates:
            - Path=/api/dict/**,/api/config/**,/api/api-market/**,/api/tracing/**,/api/trace/**,/api/third-party/**,/api/packages/**,/api/activities/**,/api/codegen/**,/api/error-doc/**

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-must-be-at-least-32-characters}
  access-token-expiration: 7200000
  refresh-token-expiration: 604800000
  issuer: my-todo-app

# Rate Limiting (多维度限流)
rate-limit:
  enabled: true
  ip:
    limit: 100
    period: 60
  user:
    limit: 200
    period: 60
  tenant:
    limit: 500
    period: 60

# 健康检查配置
health-check:
  enabled: true
  interval: 30000   # 30秒检查一次
  timeout: 5000     # 5秒超时

# 断路器配置
circuit-breaker:
  enabled: true
  failure-threshold: 5       # 失败次数阈值
  open-duration: 60000       # OPEN状态持续时间(ms)
  half-open-max-requests: 1  # HALF_OPEN探测请求数

# 金丝雀发布配置
canary:
  enabled: true
  routes:
    - service-id: erp-service
      target-version: v2
      traffic-percentage: 10

# Knife4j API Documentation
knife4j:
  gateway:
    enabled: true
    strategy: discover
    discover:
      enabled: true
      version: openapi3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,gateway-health,gateway-status
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    com.example.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
