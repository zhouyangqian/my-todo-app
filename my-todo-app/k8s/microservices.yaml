# Shared environment ConfigMap for all microservices
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-config
  namespace: my-todo
data:
  SPRING_PROFILES_ACTIVE: "k8s"
  NACOS_SERVER: "nacos:8848"
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_USER: "root"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: my-todo
type: Opaque
stringData:
  root-password: "root"
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: my-todo
type: Opaque
stringData:
  jwt-secret: "your-256-bit-secret-key-here-must-be-at-least-32-characters-for-security"
---
# Auth Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: my-todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: my-todo/auth-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: service-config
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: root-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: jwt-secret
            - name: MYSQL_DB
              value: "my_todo_auth"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: my-todo
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
---
